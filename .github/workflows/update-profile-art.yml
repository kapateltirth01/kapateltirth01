name: Update profile art

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_PROFILE_USER: kapateltirth01
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scraper deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Fetch GitHub contribution data
        run: python scripts/fetch_contributions.py

      - name: Render GitHub contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Regenerate info card from central config
        run: python scripts/make_info_card.py

      - name: Commit refreshed profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg info-card.svg data/contributions.json
          git diff --cached --quiet || git commit -m "chore: refresh profile assets"

      - name: Push refreshed assets
        run: git push
